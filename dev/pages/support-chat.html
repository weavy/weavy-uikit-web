<!doctype html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1" />
  
  <script type="module" src="/lib"></script>
  <script type="module" src="/utils/tanstack-dev-tools.ts" async defer></script>
  <style>
    :root {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
    }

    html {
      display: flex;
      height: 100dvh;
      max-height: 100dvh;
    }

    body {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .grid {
      flex: 1;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      gap: 0.5rem;
      background: #fff;
      min-height: 0;
    }
  </style>
  <script type="module" src="/utils/dev-user.ts" async defer></script>
  <script type="module">
    const { Weavy } = await import("/lib");
    const weavy = new Weavy({
      url: "%WEAVY_URL%",
      tokenFactory: async (refresh) => {
        let response = await fetch(`/api/token${refresh ? "?refresh=true" : ""}`);
        if (response.ok) {
          let data = await response.json();
          return data.access_token;
        } else {
          throw new Error("Could not get access token from server!");
        }
      },
      reactions: "❤️ 👍",
    });
    globalThis.weavy = weavy;
  </script>
</head>
<body>
  <div class="grid">
    <wy-conversations appTypes="chat"></wy-conversations>
    <wy-chat>
      <span slot="empty">No chat selected.</span>
    </wy-chat>
  </div>
  <tanstack-dev-tools buttonposition="bottom-left" position="top"></tanstack-dev-tools>

  <script>
    const conversations = document.querySelector("wy-conversations");    
    
    const chat = document.querySelector("wy-chat");

    conversations.addEventListener("wy-unread", (e) => {
      console.log("Unread conversations:", e.detail.unread);
    });

    conversations.addEventListener("wy-action", (e) => {
      console.log("wy-action", e.detail);
      if (e.detail.action === "select" && e.detail.app !== undefined) {
        chat.uid = e.detail.app?.id;
      }
    });
  </script>
</body>
