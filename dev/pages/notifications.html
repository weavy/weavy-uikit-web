<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content"
    />
    <link rel="modulepreload" href="/locales/sv-SE.ts" />
    <script type="module" src="/lib/index.ts"></script>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
          "Open Sans", "Helvetica Neue", sans-serif;
      }

    html {
      display: flex;
      height: 100dvh;
    }

    body {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    header {
      padding: .5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      justify-content: flex-end; /* Align items to the right */
    }
    </style>
    <script type="module" src="/utils/dev-user.ts" async defer></script>
</head>

  <body>
    <dev-current-user position="top-left"></dev-current-user>
    <wy-context url="%WEAVY_URL%" tokenUrl="/api/token">
      <header>
        <wy-notification-badge badge="dot"></wy-notification-badge>  
        <wy-notification-badge></wy-notification-badge>  
        <wy-notification-button overlay="drawer"></wy-notification-button>
      </header>
      <wy-notifications>
        <span slot="actions"></span>
      </wy-notifications>
      <wy-notification-toasts></wy-notification-toasts>
      <tanstack-dev-tools buttonposition="bottom-left" position="top"></tanstack-dev-tools>
    </wy-context>
  
  </body>
</html>
