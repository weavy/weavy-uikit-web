<!DOCTYPE html>
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content"
  />
  <link rel="modulepreload" href="/locales/sv-SE.ts" />
  <script type="module" src="/lib"></script>
  <script type="module" src="/utils/tanstack-dev-tools.ts"></script>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    }

    html {
      display: flex;
      height: 100dvh;
    }

    body {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    header {
      padding: .5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      justify-content: flex-end; /* Align items to the right */
    }


  </style>
  <script type="module" src="/utils/dev-user.ts" async defer></script>
</head>
<body>
  <dev-current-user position="top-left"></dev-current-user>
  <wy-context
    url="%WEAVY_URL%"
    reactions="👍 ❤️ 😂 😒 😁"
    tokenFactory="async (refresh) => {
      let response = await fetch(`/api/token${refresh ? '?refresh=true' : ''}`)

      if (response.ok) {          
        let data = await response.json();
        return data.access_token
      } else {
        throw new Error('Could not get access token from server!')
      }
    }"
  >
    <header>
        <wy-messenger-badge badge="dot"></wy-messenger-badge>  
        <wy-messenger-badge></wy-messenger-badge>
        <wy-messenger-button></wy-messenger-button>     
    </header>

    <wy-messenger
      features="report block"
      contextualData="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum."
    ></wy-messenger>
    <tanstack-dev-tools buttonposition="bottom-left" position="top"></tanstack-dev-tools>
  </wy-context>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const messenger = document.querySelector("wy-messenger");

      messenger.addEventListener("wy-unread", (e) => {
        console.log("Messenger unread from event:", e.detail);
        console.log("Messenger unread from property:", messenger.unread);
      });
    });
  </script>
</body>
